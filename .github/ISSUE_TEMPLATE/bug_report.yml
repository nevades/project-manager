name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a board
        2. Drag a card to …
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 1.0.0 or a1b2c3d
  - type: dropdown
    id: setup
    attributes:
      label: How are you running Tasklane?
      options:
        - Docker Compose
        - Docker image only
        - Local development (mvnw + npm)
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 140 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Output of `docker compose logs app`, browser console errors, or screenshots.
      render: text
