name: tasklane

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasklane
      POSTGRES_USER: ${DB_USERNAME:-tasklane}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tasklane}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed so the API can also be run from your IDE against this database.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tasklane"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tasklane
      DB_USERNAME: ${DB_USERNAME:-tasklane}
      DB_PASSWORD: ${DB_PASSWORD:-tasklane}
      DEMO_DATA: ${DEMO_DATA:-true}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
